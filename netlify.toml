# Login and account pages: never cache, never show in search results.
[[headers]]
  for = "/account*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex"
[[headers]]
  for = "/reset-password*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex"
    Referrer-Policy = "no-referrer"
