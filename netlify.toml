# Netlify settings. The build steps write js/supabase-config.js from the
# SUPABASE_URL / SUPABASE_ANON_KEY environment variables (see docs/CLIENT-PORTAL-SETUP.md)
# and regenerate sitemap.xml from the public pages (scripts/build-sitemap.mjs).
[build]
  publish = "."
  command = "node scripts/build-config.mjs && node scripts/build-sitemap.mjs"

# Security headers: block other sites from framing this site, stop
# unexpected scripts from running, and force HTTPS.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"

# Cache images for a week, CSS/JS for a day (refreshes after each deploy)
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# ---------------------------------------------------------------------------
# Domain: the old Netlify address permanently redirects to the real domain.
[[redirects]]
  from = "https://harnoorsingh.netlify.app/*"
  to = "https://harnoorsingh.in/:splat"
  status = 301
  force = true
# The site's actual Netlify address (from the Netlify deploy checks) also redirects.
[[redirects]]
  from = "https://cerulean-muffin-934237.netlify.app/*"
  to = "https://harnoorsingh.in/:splat"
  status = 301
  force = true
# www.harnoorsingh.in → harnoorsingh.in (active once www is added as a domain alias in Netlify).
[[redirects]]
  from = "https://www.harnoorsingh.in/*"
  to = "https://harnoorsingh.in/:splat"
  status = 301
  force = true

# Internal project files (checks, tests, docs, config) are in the repository
