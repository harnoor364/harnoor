# Checks the LIVE website every 30 minutes (read-only GET requests).
# Failure opens (or updates) one GitHub issue; GitHub emails you about it.
# Recovery comments on and closes that issue.
name: Live site monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write # start the AI diagnosis workflow

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: vars.SITE_URL != ''
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the live site
        id: check
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: node scripts/monitor.mjs
        continue-on-error: true

      - name: Open, update or close the incident issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          OUTCOME: ${{ steps.check.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="🚨 Website monitor: live site checks failing"
          gh label create incident --color B60205 --description "Automated incident" 2>/dev/null || true
          gh label create ai-diagnose --color 5319E7 --description "Ask the AI agent to diagnose" 2>/dev/null || true
          OPEN=$(gh issue list --state open --label incident --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ "$OUTCOME" = "failure" ]; then
            # Fingerprint = which checks fail. Only notify when it changes (no email every 30 minutes).
            FP=$(node -e 'const r=require("./reports/monitor.json");console.log(r.failed.map(c=>c.id).sort().join(",").length+"-"+require("crypto").createHash("sha256").update(r.failed.map(c=>c.id).sort().join(",")).digest("hex").slice(0,12))')
            if [ -z "$OPEN" ]; then
              { cat reports/monitor-summary.md; echo; echo "Run: $RUN_URL"; echo "<!-- fingerprint:$FP -->"; } > body.md
              URL=$(gh issue create --title "$TITLE" --label incident --body-file body.md)
              gh workflow run ai-diagnose.yml -f issue="${URL##*/}" || echo "AI diagnosis not started (workflow missing or disabled)"
            else
              LAST=$(gh issue view "$OPEN" --json body,comments --jq '([.body] + [.comments[].body]) | map(select(contains("fingerprint:"))) | last')
              if ! printf '%s' "$LAST" | grep -q "fingerprint:$FP"; then
                { echo "The failing checks changed at $(date -u +%FT%TZ):"; echo; cat reports/monitor-summary.md; echo; echo "Run: $RUN_URL"; echo "<!-- fingerprint:$FP -->"; } > body.md
                gh issue comment "$OPEN" --body-file body.md
              fi
            fi
            exit 1
          elif [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --body "✅ All live checks passed again at $(date -u +%FT%TZ). Closing. Run: $RUN_URL"
            gh issue close "$OPEN"
          fi
