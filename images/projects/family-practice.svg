    <rect x="24" y="24" width="44" height="44" rx="12" fill="#eaf5fc"/>
    <circle cx="46" cy="46" r="9" fill="#2878b5"/>
    <text x="24" y="100" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#17283b">Chronic Care</text>
    <text x="24" y="128" font-family="Inter, Arial, sans-serif" font-size="15" fill="#4a5b6e">Diabetes, BP &amp; more</text>
