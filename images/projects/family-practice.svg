      <stop offset="0" stop-color="#eaf5fc"/>
      <stop offset="1" stop-color="#2878b5" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="#f7f8fa"/>
