<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Preview of the SMOKEHOUSE BBQ website">
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e2f4f"/>
      <stop offset="1" stop-color="#a8323f" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="#0f1a2e"/>
  <!-- browser bar -->
  <rect width="1200" height="44" fill="#0b1220"/>
  <circle cx="26" cy="22" r="7" fill="#f87171"/><circle cx="48" cy="22" r="7" fill="#fbbf24"/><circle cx="70" cy="22" r="7" fill="#4ade80"/>
  <rect x="380" y="10" width="440" height="24" rx="12" fill="#1a2436"/>
  <text x="600" y="27" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#a9b3c7">BBQ Restaurant</text>
  <!-- nav -->
  <rect y="44" width="1200" height="74" fill="#0f1a2e"/>
  <text x="80" y="90" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" fill="#ffffff">SMOKEHOUSE BBQ</text>
  <g font-family="Inter, Arial, sans-serif" font-size="15" fill="#a9b3c7">
    <text x="700" y="87">About</text><text x="775" y="87">Services</text><text x="865" y="87">Reviews</text><text x="950" y="87">Contact</text>
  </g>
  <rect x="1030" y="64" width="110" height="36" rx="18" fill="#a8323f"/>
  <text x="1085" y="87" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">View</text>
  
  <g transform="translate(80,150)">
    <rect width="274" height="34" rx="17" fill="#1e2f4f"/>
    <circle cx="20" cy="17" r="5" fill="#a8323f"/>
    <text x="34" y="22" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Scroll into the restaurant</text>
  </g>
  <!-- headline -->
  <text font-family="Georgia, 'Times New Roman', serif" font-size="54" fill="#ffffff" font-weight="500">
    <tspan x="80" y="250">Slow-smoked barbecue,</tspan>
    <tspan x="80" y="316">made with <tspan fill="#ec8472" font-style="italic">fire.</tspan></tspan>
  </text>
  <text font-family="Inter, Arial, sans-serif" font-size="19" fill="#a9b3c7">
    <tspan x="80" y="372">Barbecue, drinks, events and catering</tspan>
    <tspan x="80" y="400">A 3D scroll walk into the restaurant</tspan>
  </text>
  <rect x="80" y="436" width="220" height="54" rx="27" fill="#a8323f"/>
  <text x="190" y="469" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff">View the Menu</text>
  <rect x="316" y="436" width="190" height="54" rx="27" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <text x="411" y="469" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#ffffff">Plan an Event</text>
  <!-- hero visual -->
  <g transform="translate(760,150)">
    <rect width="360" height="350" rx="28" fill="url(#hero)"/>
    <rect x="40" y="40" width="280" height="190" rx="20" fill="rgba(255,255,255,0.06)" opacity="0.9"/>
    <circle cx="100" cy="110" r="34" fill="#1e2f4f"/><circle cx="100" cy="110" r="18" fill="#a8323f"/>
    <rect x="150" y="90" width="140" height="14" rx="7" fill="#ffffff" opacity="0.75"/>
    <rect x="150" y="116" width="100" height="10" rx="5" fill="#a9b3c7" opacity="0.6"/>
    <rect x="70" y="170" width="220" height="10" rx="5" fill="#a9b3c7" opacity="0.35"/>
    <rect x="70" y="192" width="170" height="10" rx="5" fill="#a9b3c7" opacity="0.35"/>
    <rect x="-30" y="262" width="230" height="64" rx="16" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <circle cx="2" cy="294" r="16" fill="#1e2f4f"/>
    <rect x="28" y="282" width="140" height="10" rx="5" fill="#ffffff" opacity="0.7"/>
    <rect x="28" y="300" width="96" height="8" rx="4" fill="#a9b3c7" opacity="0.5"/>
  </g>
  
  <g transform="translate(80,560)">
    <rect width="320" height="150" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <rect x="24" y="24" width="44" height="44" rx="12" fill="#1e2f4f"/>
    <circle cx="46" cy="46" r="9" fill="#a8323f"/>
    <text x="24" y="100" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Brisket &amp; Ribs</text>
    <text x="24" y="128" font-family="Inter, Arial, sans-serif" font-size="15" fill="#a9b3c7">Smoked low and slow</text>
  </g>
  <g transform="translate(440,560)">
    <rect width="320" height="150" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <rect x="24" y="24" width="44" height="44" rx="12" fill="#1e2f4f"/>
    <circle cx="46" cy="46" r="9" fill="#a8323f"/>
    <text x="24" y="100" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Catering</text>
    <text x="24" y="128" font-family="Inter, Arial, sans-serif" font-size="15" fill="#a9b3c7">Parties &amp; offices</text>
  </g>
  <g transform="translate(800,560)">
    <rect width="320" height="150" rx="18" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)"/>
    <rect x="24" y="24" width="44" height="44" rx="12" fill="#1e2f4f"/>
    <circle cx="46" cy="46" r="9" fill="#a8323f"/>
    <text x="24" y="100" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#ffffff">Events</text>
    <text x="24" y="128" font-family="Inter, Arial, sans-serif" font-size="15" fill="#a9b3c7">Private parties</text>
  </g>
</svg>
