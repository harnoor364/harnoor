<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Preview of the Child Care Clinic website">
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9f3e8"/>
      <stop offset="1" stop-color="#367fbb" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="750" fill="#f7f9fc"/>
  <!-- browser bar -->
  <rect width="1200" height="44" fill="#f1f4f8"/>
  <circle cx="26" cy="22" r="7" fill="#f87171"/><circle cx="48" cy="22" r="7" fill="#fbbf24"/><circle cx="70" cy="22" r="7" fill="#4ade80"/>
  <rect x="380" y="10" width="440" height="24" rx="12" fill="#ffffff"/>
  <text x="600" y="27" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="13" fill="#4b5b70">Child Specialist Clinic</text>
  <!-- nav -->
  <rect y="44" width="1200" height="74" fill="#ffffff"/>
  <text x="80" y="90" font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="700" fill="#203047">Child Care Clinic</text>
  <g font-family="Inter, Arial, sans-serif" font-size="15" fill="#4b5b70">
    <text x="700" y="87">About</text><text x="775" y="87">Services</text><text x="865" y="87">Reviews</text><text x="950" y="87">Contact</text>
  </g>
  <rect x="1030" y="64" width="110" height="36" rx="18" fill="#367fbb"/>
  <text x="1085" y="87" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">Request</text>
  
  <g transform="translate(80,150)">
    <rect width="247" height="34" rx="17" fill="#d9f3e8"/>
    <circle cx="20" cy="17" r="5" fill="#367fbb"/>
    <text x="34" y="22" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="600" fill="#26679c">Child Specialist Clinic</text>
  </g>
  <!-- headline -->
  <text font-family="Georgia, 'Times New Roman', serif" font-size="54" fill="#203047" font-weight="500">
    <tspan x="80" y="250">Caring for your child&#x27;s</tspan>
    <tspan x="80" y="316">health in <tspan fill="#26679c" font-style="italic">Ludhiana.</tspan></tspan>
  </text>
  <text font-family="Inter, Arial, sans-serif" font-size="19" fill="#4b5b70">
    <tspan x="80" y="372">Pediatrician &amp; Neonatologist</tspan>
    <tspan x="80" y="400">Clinic timings, fees and appointment requests</tspan>
  </text>
  <rect x="80" y="436" width="220" height="54" rx="27" fill="#367fbb"/>
  <text x="190" y="469" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff">Request Appointment</text>
  <rect x="316" y="436" width="190" height="54" rx="27" fill="none" stroke="#367fbb" stroke-width="2"/>
  <text x="411" y="469" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="600" fill="#203047">Call the Clinic</text>
  <!-- hero visual -->
  <g transform="translate(760,150)">
    <rect width="360" height="350" rx="28" fill="url(#hero)"/>
    <rect x="40" y="40" width="280" height="190" rx="20" fill="#ffffff" opacity="0.9"/>
    <circle cx="100" cy="110" r="34" fill="#d9f3e8"/><circle cx="100" cy="110" r="18" fill="#367fbb"/>
    <rect x="150" y="90" width="140" height="14" rx="7" fill="#203047" opacity="0.75"/>
    <rect x="150" y="116" width="100" height="10" rx="5" fill="#4b5b70" opacity="0.6"/>
    <rect x="70" y="170" width="220" height="10" rx="5" fill="#4b5b70" opacity="0.35"/>
    <rect x="70" y="192" width="170" height="10" rx="5" fill="#4b5b70" opacity="0.35"/>
    <rect x="-30" y="262" width="230" height="64" rx="16" fill="#ffffff" stroke="#e5e9f0"/>
    <circle cx="2" cy="294" r="16" fill="#d9f3e8"/>
    <rect x="28" y="282" width="140" height="10" rx="5" fill="#203047" opacity="0.7"/>
    <rect x="28" y="300" width="96" height="8" rx="4" fill="#4b5b70" opacity="0.5"/>
  </g>
  
  <g transform="translate(80,560)">
    <rect width="320" height="150" rx="18" fill="#ffffff" stroke="#e5e9f0"/>
    <rect x="24" y="24" width="44" height="44" rx="12" fill="#d9f3e8"/>
    <circle cx="46" cy="46" r="9" fill="#367fbb"/>
    <text x="24" y="100" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#203047">Newborn Care</text>
    <text x="24" y="128" font-family="Inter, Arial, sans-serif" font-size="15" fill="#4b5b70">Checks, feeding &amp; growth</text>
  </g>
  <g transform="translate(440,560)">
    <rect width="320" height="150" rx="18" fill="#ffffff" stroke="#e5e9f0"/>
    <rect x="24" y="24" width="44" height="44" rx="12" fill="#d9f3e8"/>
    <circle cx="46" cy="46" r="9" fill="#367fbb"/>
    <text x="24" y="100" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#203047">Vaccinations</text>
    <text x="24" y="128" font-family="Inter, Arial, sans-serif" font-size="15" fill="#4b5b70">Complete immunisation</text>
  </g>
  <g transform="translate(800,560)">
    <rect width="320" height="150" rx="18" fill="#ffffff" stroke="#e5e9f0"/>
    <rect x="24" y="24" width="44" height="44" rx="12" fill="#d9f3e8"/>
    <circle cx="46" cy="46" r="9" fill="#367fbb"/>
    <text x="24" y="100" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" fill="#203047">Child Illness</text>
    <text x="24" y="128" font-family="Inter, Arial, sans-serif" font-size="15" fill="#4b5b70">Fever, cough &amp; more</text>
  </g>
